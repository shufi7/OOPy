<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Dari prosedural ke OOP</title>
  <desc id="desc">Pendekatan prosedural menyimpan data dan fungsi secara terpisah. Class LokasiPantau mengelompokkan atribut dan method.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168477"/></marker></defs>
  <rect width="1040" height="600" rx="24" fill="#f4f8f7"/>
  <text x="520" y="58" text-anchor="middle" fill="#153b38" font-family="Arial,sans-serif" font-size="34" font-weight="700">Data dan perilaku: dua cara mengaturnya</text>
  <rect x="40" y="100" width="400" height="445" rx="20" fill="#ffffff" stroke="#cddbd8" stroke-width="2"/>
  <text x="240" y="145" text-anchor="middle" fill="#35514d" font-family="Arial,sans-serif" font-size="28" font-weight="700">Prosedural</text>
  <rect x="76" y="178" width="328" height="190" rx="14" fill="#eef4f3"/>
  <text x="100" y="216" fill="#53635f" font-family="Arial,sans-serif" font-size="21" font-weight="700">DATA</text>
  <text x="100" y="258" fill="#183a37" font-family="monospace" font-size="24">nama_lokasi</text>
  <text x="100" y="298" fill="#183a37" font-family="monospace" font-size="24">tinggi_air</text>
  <text x="100" y="338" fill="#183a37" font-family="monospace" font-size="24">ph</text>
  <rect x="76" y="390" width="328" height="104" rx="14" fill="#f6f2e9" stroke="#e8dfcc"/>
  <text x="100" y="429" fill="#78653f" font-family="Arial,sans-serif" font-size="21" font-weight="700">FUNGSI TERPISAH</text>
  <text x="100" y="472" fill="#183a37" font-family="monospace" font-size="24">status_air()</text>
  <path d="M450 322H575" stroke="#168477" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="512" y="300" text-anchor="middle" fill="#168477" font-family="Arial,sans-serif" font-size="19" font-weight="700">dikelompokkan</text>
  <rect x="600" y="100" width="400" height="445" rx="20" fill="#e7f3f0" stroke="#82bdb3" stroke-width="2"/>
  <rect x="600" y="100" width="400" height="76" rx="20" fill="#177f73"/>
  <path d="M600 156H1000V176H600Z" fill="#177f73"/>
  <text x="800" y="150" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="29" font-weight="700">class LokasiPantau</text>
  <text x="642" y="225" fill="#42635e" font-family="Arial,sans-serif" font-size="21" font-weight="700">ATRIBUT</text>
  <text x="642" y="266" fill="#183a37" font-family="monospace" font-size="24">nama</text>
  <text x="642" y="305" fill="#183a37" font-family="monospace" font-size="24">tinggi_air</text>
  <text x="642" y="344" fill="#183a37" font-family="monospace" font-size="24">ph</text>
  <path d="M642 368H958" stroke="#b7d4ce" stroke-width="2"/>
  <text x="642" y="410" fill="#42635e" font-family="Arial,sans-serif" font-size="21" font-weight="700">METHOD</text>
  <text x="642" y="454" fill="#183a37" font-family="monospace" font-size="24">status_air()</text>
  <text x="800" y="510" text-anchor="middle" fill="#177f73" font-family="Arial,sans-serif" font-size="20" font-weight="700">Data + perilaku dalam satu object</text>
</svg>
