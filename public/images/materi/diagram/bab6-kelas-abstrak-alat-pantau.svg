<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Kontrak pada abstract class sensor</title>
  <desc id="desc">Abstract class SensorLingkungan menetapkan method abstrak baca_data(). Subclass konkret mengimplementasikannya sebelum dapat dibuat menjadi object.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168477"/></marker></defs>
  <rect width="1040" height="600" rx="24" fill="#f4f8f7"/>
  <text x="520" y="58" text-anchor="middle" fill="#153b38" font-family="Arial,sans-serif" font-size="34" font-weight="700">Abstract class menetapkan kontrak</text>
  <rect x="300" y="102" width="440" height="190" rx="20" fill="#e7f3f0" stroke="#82bdb3" stroke-width="2"/>
  <rect x="300" y="102" width="440" height="70" rx="20" fill="#177f73"/>
  <path d="M300 152H740V172H300Z" fill="#177f73"/>
  <text x="520" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="29" font-weight="700">SensorLingkungan</text>
  <text x="520" y="211" text-anchor="middle" fill="#42635e" font-family="Arial,sans-serif" font-size="21" font-weight="700">ABSTRACT BASE CLASS</text>
  <text x="520" y="250" text-anchor="middle" fill="#183a37" font-family="monospace" font-size="24">@abstractmethod baca_data()</text>
  <rect x="355" y="304" width="330" height="54" rx="27" fill="#fbefeb" stroke="#e6b5a6" stroke-width="2"/>
  <text x="520" y="339" text-anchor="middle" fill="#a45139" font-family="Arial,sans-serif" font-size="19" font-weight="700">Tidak diinstansiasi langsung</text>
  <path d="M520 360V390M185 390H855M185 390V420M520 390V420M855 390V420" fill="none" stroke="#168477" stroke-width="4"/>
  <path d="M185 398V417M520 398V417M855 398V417" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="436" width="240" height="108" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="185" y="478" fill="#177f73" font-family="monospace" font-size="23" font-weight="700">SensorPH</text>
    <text x="185" y="514" fill="#53635f" font-size="18">implementasi pH</text>
    <rect x="400" y="436" width="240" height="108" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="520" y="478" fill="#177f73" font-family="monospace" font-size="23" font-weight="700">SensorSuhu</text>
    <text x="520" y="514" fill="#53635f" font-size="18">implementasi suhu</text>
    <rect x="735" y="436" width="240" height="108" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="855" y="478" fill="#177f73" font-family="monospace" font-size="23" font-weight="700">Subclass konkret</text>
    <text x="855" y="514" fill="#53635f" font-size="18">wajib penuhi kontrak</text>
  </g>
</svg>
