<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Class Ekosistem dan object-nya</title>
  <desc id="desc">Satu class Ekosistem menyediakan atribut nama dan lokasi serta method info untuk object sungai, rawa, dan mangrove.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168477"/></marker></defs>
  <rect width="1040" height="600" rx="24" fill="#f4f8f7"/>
  <text x="520" y="58" text-anchor="middle" fill="#153b38" font-family="Arial,sans-serif" font-size="34" font-weight="700">Satu class, banyak object</text>
  <rect x="42" y="142" width="340" height="330" rx="20" fill="#e7f3f0" stroke="#82bdb3" stroke-width="2"/>
  <rect x="42" y="142" width="340" height="74" rx="20" fill="#177f73"/>
  <path d="M42 196H382V216H42Z" fill="#177f73"/>
  <text x="212" y="190" text-anchor="middle" fill="#fff" font-family="monospace" font-size="30" font-weight="700">class Ekosistem</text>
  <text x="80" y="262" fill="#42635e" font-family="Arial,sans-serif" font-size="21" font-weight="700">ATRIBUT</text>
  <text x="80" y="301" fill="#183a37" font-family="monospace" font-size="24">nama · lokasi</text>
  <path d="M80 322H344" stroke="#b7d4ce" stroke-width="2"/>
  <text x="80" y="362" fill="#42635e" font-family="Arial,sans-serif" font-size="21" font-weight="700">METHOD</text>
  <text x="80" y="402" fill="#183a37" font-family="monospace" font-size="24">info()</text>
  <text x="212" y="445" text-anchor="middle" fill="#177f73" font-family="Arial,sans-serif" font-size="20" font-weight="700">rancangan (class)</text>
  <path d="M402 306H448V190H486M448 306H486M448 306V420H486" fill="none" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="448" y="280" text-anchor="middle" fill="#168477" font-family="Arial,sans-serif" font-size="18" font-weight="700">membuat</text>
  <g font-family="Arial,sans-serif">
    <rect x="510" y="124" width="490" height="130" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <rect x="510" y="124" width="12" height="130" rx="6" fill="#4a9c75"/>
    <text x="548" y="166" fill="#177f73" font-size="20" font-weight="700">OBJECT · SUNGAI</text>
    <text x="548" y="204" fill="#183a37" font-family="monospace" font-size="22">nama: Sungai Martapura</text>
    <text x="548" y="235" fill="#183a37" font-family="monospace" font-size="22">lokasi: Banjarmasin</text>
    <rect x="510" y="274" width="490" height="130" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <rect x="510" y="274" width="12" height="130" rx="6" fill="#6ca992"/>
    <text x="548" y="316" fill="#177f73" font-size="20" font-weight="700">OBJECT · RAWA</text>
    <text x="548" y="354" fill="#183a37" font-family="monospace" font-size="22">nama: Rawa Bangkau</text>
    <text x="548" y="385" fill="#183a37" font-family="monospace" font-size="22">lokasi: Hulu Sungai Selatan</text>
    <rect x="510" y="424" width="490" height="130" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <rect x="510" y="424" width="12" height="130" rx="6" fill="#90bbaa"/>
    <text x="548" y="466" fill="#177f73" font-size="20" font-weight="700">OBJECT · MANGROVE</text>
    <text x="548" y="504" fill="#183a37" font-family="monospace" font-size="22">nama: Mangrove</text>
    <text x="548" y="535" fill="#183a37" font-family="monospace" font-size="22">lokasi: Pesisir Tanah Laut</text>
  </g>
</svg>
