<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Pewarisan pada keluarga Ekosistem</title>
  <desc id="desc">Superclass Ekosistem mewariskan atribut nama dan lokasi serta method info kepada Sungai, Rawa, dan Mangrove sebagai hubungan is-a.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168477"/></marker></defs>
  <rect width="1040" height="600" rx="24" fill="#f4f8f7"/>
  <text x="520" y="58" text-anchor="middle" fill="#153b38" font-family="Arial,sans-serif" font-size="34" font-weight="700">Pewarisan: keluarga class Ekosistem</text>
  <rect x="345" y="98" width="350" height="182" rx="20" fill="#e7f3f0" stroke="#82bdb3" stroke-width="2"/>
  <rect x="345" y="98" width="350" height="68" rx="20" fill="#177f73"/>
  <path d="M345 146H695V166H345Z" fill="#177f73"/>
  <text x="520" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="29" font-weight="700">Ekosistem</text>
  <text x="520" y="205" text-anchor="middle" fill="#183a37" font-family="Arial,sans-serif" font-size="22">atribut: nama, lokasi</text>
  <text x="520" y="242" text-anchor="middle" fill="#183a37" font-family="monospace" font-size="23">method: info()</text>
  <path d="M520 288V328M170 328H870M170 328V376M520 328V376M870 328V376" fill="none" stroke="#168477" stroke-width="4"/>
  <path d="M170 350V373M520 350V373M870 350V373" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="55" y="390" width="230" height="112" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="170" y="436" fill="#177f73" font-family="monospace" font-size="26" font-weight="700">Sungai</text>
    <text x="170" y="474" fill="#53635f" font-size="19">is-a Ekosistem</text>
    <rect x="405" y="390" width="230" height="112" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="520" y="436" fill="#177f73" font-family="monospace" font-size="26" font-weight="700">Rawa</text>
    <text x="520" y="474" fill="#53635f" font-size="19">is-a Ekosistem</text>
    <rect x="755" y="390" width="230" height="112" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="870" y="436" fill="#177f73" font-family="monospace" font-size="26" font-weight="700">Mangrove</text>
    <text x="870" y="474" fill="#53635f" font-size="19">is-a Ekosistem</text>
  </g>
  <text x="520" y="550" text-anchor="middle" fill="#42635e" font-family="Arial,sans-serif" font-size="20">Subclass mewarisi data dan perilaku umum; masing-masing dapat menambah ciri khusus.</text>
</svg>
