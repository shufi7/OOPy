<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Property mengendalikan perubahan data</title>
  <desc id="desc">Nilai tinggi air masuk melalui property atau setter, divalidasi, lalu disimpan atau ditolak sebagai ValueError.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168477"/></marker></defs>
  <rect width="1040" height="600" rx="24" fill="#f4f8f7"/>
  <text x="520" y="58" text-anchor="middle" fill="#153b38" font-family="Arial,sans-serif" font-size="34" font-weight="700">Perubahan data melewati interface class</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="180" width="205" height="128" rx="18" fill="#fff" stroke="#cddbd8" stroke-width="2"/>
    <text x="142" y="222" fill="#42635e" font-size="20" font-weight="700">INPUT NILAI BARU</text>
    <text x="142" y="268" fill="#183a37" font-family="monospace" font-size="25">tinggi_air</text>
    <path d="M250 244H298" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="310" y="180" width="220" height="128" rx="18" fill="#e7f3f0" stroke="#82bdb3" stroke-width="2"/>
    <text x="420" y="222" fill="#177f73" font-size="20" font-weight="700">INTERFACE CLASS</text>
    <text x="420" y="268" fill="#183a37" font-family="monospace" font-size="25">property / setter</text>
    <path d="M535 244H586" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M680 166L774 244L680 322L586 244Z" fill="#fff" stroke="#82bdb3" stroke-width="3"/>
    <text x="680" y="237" fill="#183a37" font-size="21" font-weight="700">VALIDASI</text>
    <text x="680" y="266" fill="#53635f" font-size="18">nilai ≥ 0?</text>
  </g>
  <path d="M774 244H844V160H878" fill="none" stroke="#168477" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="143" fill="#177f73" font-family="Arial,sans-serif" font-size="19" font-weight="700">VALID</text>
  <rect x="888" y="112" width="122" height="100" rx="16" fill="#e5f2ea" stroke="#9fc7ad" stroke-width="2"/>
  <text x="949" y="151" text-anchor="middle" fill="#28724c" font-family="Arial,sans-serif" font-size="19" font-weight="700">DISIMPAN</text>
  <text x="949" y="183" text-anchor="middle" fill="#183a37" font-family="monospace" font-size="18">__tinggi_air</text>
  <path d="M680 328V406H844V460H878" fill="none" stroke="#b66b50" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="389" fill="#a45139" font-family="Arial,sans-serif" font-size="19" font-weight="700">TIDAK VALID</text>
  <rect x="888" y="420" width="122" height="92" rx="16" fill="#fbefeb" stroke="#e6b5a6" stroke-width="2"/>
  <text x="949" y="458" text-anchor="middle" fill="#a45139" font-family="monospace" font-size="18" font-weight="700">ValueError</text>
  <text x="949" y="486" text-anchor="middle" fill="#67463d" font-family="Arial,sans-serif" font-size="16">ditolak</text>
  <rect x="40" y="420" width="690" height="92" rx="16" fill="#e7f3f0"/>
  <text x="385" y="458" text-anchor="middle" fill="#177f73" font-family="Arial,sans-serif" font-size="21" font-weight="700">Akses data dikontrol melalui antarmuka class</text>
  <text x="385" y="488" text-anchor="middle" fill="#42635e" font-family="Arial,sans-serif" font-size="18">Nilai lama tetap aman jika validasi gagal.</text>
</svg>
